[project]
name = "kvm-cua"
version = "0.5.2"
description = "Computer-using agent that drives a remote machine through a JetKVM (screen parsing + TypeSafe Jev decisions + human-like HID input)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=14",
    "httpx>=0.28",
    "mcp>=1.20",
    "numpy>=2",
    "pillow>=11",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "segno>=1.6.6",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# OmniParser v2: YOLO icon detection + Florence-2 icon captions + OCR.
omniparser = [
    "easyocr>=1.7",
    "ocrmac>=1.0; sys_platform == 'darwin'",
    "einops>=0.8",
    "huggingface-hub>=0.26",
    "timm>=1.0",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.46,<4.50",
    "ultralytics>=8.3",
]

[project.scripts]
cua = "kvm_cua.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvm_cua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
